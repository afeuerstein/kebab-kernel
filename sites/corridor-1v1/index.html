*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#050505;cursor:crosshair}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:50;color:#e8e6df;font-family:'Share Tech Mono',monospace}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px}

#cross:after{top:50%;left:0;height:1px;width:100%;transform:translateY(-.5px)}
#cross .dot{position:absolute;left:50%;top:50%;width:3px;height:3px;background:#ff5d3a;transform:translate(-50%,-50%);border-radius:50%}
#bottomL{position:absolute;left:26px;bottom:24px;font-size:13px;letter-spacing:.2em;line-height:1.9;text-transform:uppercase}
#bottomL .hp{color:#7dffa8;font-size:26px}#bottomL .ar{color:#7db8ff;font-size:26px}
#bottomR{position:absolute;right:26px;bottom:24px;font-size:13px;letter-spacing:.2em;text-align:right;line-height:1.9;text-transform:uppercase}
#bottomR .ammo{font-size:26px;color:#e8e6df}#bottomR .ammo small{font-size:13px;color:rgba(232,230,223,.5)}
#topC{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.35em;color:rgba(232,230,223,.65);text-transform:uppercase}
#flashResult{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .4s}
#flashResult .big{font-family:'Black Ops One';font-size:clamp(34px,6vw,72px);color:#fff;text-transform:uppercase;text-shadow:0 0 30px rgba(255,255,255,.6)}
#flashResult .sub{margin-top:10px;font-size:12px;letter-spacing:.4em;color:rgba(255,255,255,.75);text-transform:uppercase}
#tag{position:absolute;left:26px;top:20px;font-size:10px;letter-spacing:.3em;color:rgba(232,230,223,.45);text-transform:uppercase;line-height:2}
#tag .over{color:#c8a24a}
#muzzle{position:fixed;inset:0;pointer-events:none;z-index:48;background:radial-gradient(circle at 50% 55%,rgba(255,220,150,.9),rgba(255,150,50,.25) 22%,transparent 45%);opacity:0}
</style>
