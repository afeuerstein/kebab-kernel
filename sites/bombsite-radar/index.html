html,body{height:100%;overflow:hidden;background:#060807}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:50;color:#cfe3c8;font-family:'Share Tech Mono',monospace;
  text-shadow:0 0 6px rgba(80,255,140,.35)}
#top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:16px 22px;font-size:12px;letter-spacing:.25em;text-transform:uppercase;

#sites{position:absolute;top:70px;left:22px;font-size:11px;letter-spacing:.25em;line-height:2;text-transform:uppercase;color:rgba(207,227,200,.75)}

#feed{position:absolute;top:70px;right:22px;width:300px;font-size:11px;letter-spacing:.12em;line-height:1.9;text-align:right;text-transform:uppercase}
#feed .f{opacity:0;transform:translateX(12px);transition:.3s}

#feed .me{color:#7dffa8}#feed .foe{color:#ff8d7a}
#throwWrap{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:auto}

#throwBtn:hover{background:#eafff0;box-shadow:0 0 46px rgba(125,255,168,.6)}
#throwWrap .k{margin-top:10px;font-size:10px;letter-spacing:.4em;color:rgba(207,227,200,.5);text-transform:uppercase}
#tag{position:absolute;left:22px;bottom:30px;font-size:10px;letter-spacing:.3em;color:rgba(207,227,200,.45);text-transform:uppercase;line-height:2}
#tag .over{color:#7dffa8}
#scan{position:fixed;inset:0;pointer-events:none;z-index:45;mix-blend-mode:overlay;opacity:.5;
