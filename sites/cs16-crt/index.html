<style>
@font-face{font-family:'Press Start 2P';src:url('/vendor/fonts/press-start-2p-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Share Tech Mono';src:url('/vendor/fonts/share-tech-mono-latin-400-normal.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#screen{position:relative;width:min(92vw,1060px);height:min(78vh,640px);border-radius:18px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#0d2410 0%,#071708 55%,#020a04 100%);
  box-shadow:0 0 0 10px #101010,0 0 0 12px #2a2a2a,0 0 90px rgba(60,255,120,.14),inset 0 0 120px rgba(0,0,0,.8);
  transform:perspective(1200px) rotateX(1.5deg)}
#screen.flashing{background:radial-gradient(ellipse at 50% 45%,#ffffff 0%,#e8ffe8 60%,#b8ffc8 100%)}
#scanlines{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
#glass{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.07),transparent 45%);}
#content{position:absolute;inset:0;z-index:4;padding:34px 40px;color:#7dff9a;
  font-family:'Press Start 2P',monospace;font-size:12px;line-height:2.1;text-shadow:0 0 8px rgba(80,255,140,.55);
  overflow:hidden}
#content .dim{color:#3f9e58;text-shadow:none}
#content .amber{color:#ffd76a;text-shadow:0 0 8px rgba(255,200,80,.5)}
#content .red{color:#ff6a5d;text-shadow:0 0 8px rgba(255,90,80,.5)}
#content .blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#term-hud{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:space-between;
  padding:14px 22px;font-family:'Share Tech Mono';font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(125,255,154,.55)}
#throwKey{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:60;cursor:pointer;
  font-family:'Press Start 2P';font-size:12px;color:#071708;background:#7dff9a;padding:16px 22px;border:none;
  box-shadow:0 0 26px rgba(125,255,154,.45);letter-spacing:.1em}
#throwKey:hover{background:#d6ffe0}
#boot{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center;
  color:#7dff9a;font-family:'Press Start 2P';font-size:13px;letter-spacing:.2em;cursor:pointer;text-align:center;line-height:2.4}
</style>
</head>
<body>
<div id="stage">
  <div id="screen">
    <div id="content"></div>
    <div id="scanlines"></div>
    <div id="glass"></div>
  </div>
</div>
<button id="throwKey">[ THROW FLASHBANG ]</button>
<div id="term-hud">
  <span>flsh.me · cstrike 1.6 terminal</span>
  <span id="flashCount">flashes: 0</span>
  <span>concept 05 / 05</span>
</div>
<div id="boot">FLSH BIOS v1.6<br><span class="blink">PRESS ANY KEY TO BOOT</span></div>
