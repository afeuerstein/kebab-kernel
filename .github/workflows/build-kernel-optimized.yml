name: Build Kernel (Optimized)

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - monthly
  schedule:
    # Run on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'

env:
  ARCH: arm64
  DEFCONFIG: vendor/kona_defconfig
  OUTPUT_DIR: out

jobs:
  build:
    name: Build Kernel for OnePlus 8T (kebab)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev python3

      - name: Install aarch64 toolchain
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
          export CROSS_COMPILE=aarch64-linux-gnu-
          echo "CROSS_COMPILE=${CROSS_COMPILE}" >> $GITHUB_ENV

      - name: Build kernel
        id: build
        run: |
          mkdir -p ${OUTPUT_DIR}
          
          # Make defconfig
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} ${DEFCONFIG} O=${OUTPUT_DIR}
          
          # Apply oplus.config if it exists
          if [ -f arch/arm64/configs/vendor/oplus.config ]; then
            echo "Applying oplus.config overrides..."
            cat arch/arm64/configs/vendor/oplus.config >> ${OUTPUT_DIR}/.config
            make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} olddefconfig O=${OUTPUT_DIR}
          fi
          
          # Build kernel with all CPU cores
          echo "Starting kernel build with -j$(nproc)..."
          make -j$(nproc) ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} O=${OUTPUT_DIR} 2>&1 | tee build.log
          
          # Check if build succeeded
          if [ ! -f ${OUTPUT_DIR}/arch/arm64/boot/Image ]; then
            echo "::error::Build failed - kernel image not found"
            echo "build_status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "Kernel built successfully"
          echo "build_status=success" >> $GITHUB_OUTPUT
          
          # Build DTBO
          echo "Building DTBO..."
          make -j$(nproc) ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} dtbo.img O=${OUTPUT_DIR} 2>&1 | tee dtbo_build.log
          
          # Collect all dtb files
          mkdir -p ${OUTPUT_DIR}/dtb
          find ${OUTPUT_DIR}/arch/arm64/boot/dts -name "*.dtb" -exec cp {} ${OUTPUT_DIR}/dtb/ \;
          
          # Create dtb.img
          cat ${OUTPUT_DIR}/dtb/*.dtb > ${OUTPUT_DIR}/dtb.img
          
          # Create dtbo.img if not already built
          if [ ! -f ${OUTPUT_DIR}/dtbo.img ]; then
            cat ${OUTPUT_DIR}/arch/arm64/boot/dtbo.img > ${OUTPUT_DIR}/dtbo.img 2>/dev/null || true
          fi
          
          echo "DTBO built successfully"

      - name: Package boot.img
        id: package
        if: steps.build.outputs.build_status == 'success'
        run: |
          # Install mkbootimg for creating boot.img
          sudo apt-get install -y android-tools-fsutils || true
          
          # Create a minimal ramdisk
          mkdir -p ${OUTPUT_DIR}/ramdisk
          (cd ${OUTPUT_DIR}/ramdisk && find . | cpio -H newc -o | gzip > ../ramdisk.cpio.gz)
          
          # Get kernel command line from defconfig
          CMDLINE=$(grep "CONFIG_CMDLINE=" ${OUTPUT_DIR}/.config | sed 's/CONFIG_CMDLINE="//;s/"$//' | sed 's/" //g')
          echo "Kernel command line: ${CMDLINE}"
          
          # Get base address from defconfig
          BASE=$(grep "CONFIG_ARM64_TEXT_OFFSET=" ${OUTPUT_DIR}/.config | sed 's/CONFIG_ARM64_TEXT_OFFSET=0x//;s/0x//' | sed 's/.*=//')
          if [ -z "$BASE" ]; then
            BASE=0x80000
          fi
          
          echo "Base address: ${BASE}"
          
          # Build boot.img using mkbootimg or manual method
          if command -v mkbootimg &> /dev/null; then
            mkbootimg --kernel ${OUTPUT_DIR}/arch/arm64/boot/Image \
                      --ramdisk ${OUTPUT_DIR}/ramdisk.cpio.gz \
                      --cmdline "${CMDLINE}" \
                      --base ${BASE} \
                      --pagesize 2048 \
                      --kernel_offset 0x00008000 \
                      --ramdisk_offset 0x02000000 \
                      --second_offset 0x00f00000 \
                      --tags_offset 0x01e00000 \
                      --os_version 13.0 \
                      --os_patch_level 2024-01-01 \
                      --output ${OUTPUT_DIR}/boot.img
          else
            echo "mkbootimg not available, creating Image-dtb..."
            # Fallback: just package kernel and dtb
            cat ${OUTPUT_DIR}/arch/arm64/boot/Image ${OUTPUT_DIR}/dtb.img > ${OUTPUT_DIR}/Image-dtb
            cp ${OUTPUT_DIR}/arch/arm64/boot/Image ${OUTPUT_DIR}/boot.img
          fi
          
          # Create a zip file for release
          cd ${OUTPUT_DIR}
          zip -r ../kernel-build-$(date +%Y%m%d).zip .
          cd ..
          
          # Create checksums
          sha256sum ${OUTPUT_DIR}/boot.img > ${OUTPUT_DIR}/boot.img.sha256 || true
          sha256sum ${OUTPUT_DIR}/kernel-build-*.zip > ${OUTPUT_DIR}/kernel-build-*.zip.sha256 || true

      - name: Upload artifacts
        if: steps.build.outputs.build_status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ github.run_id }}
          path: |
            out/
            *.zip
            *.sha256
          retention-days: 7

      - name: Create release
        if: github.ref == 'refs/heads/lineage-24.0' && (github.event_name == 'schedule' || inputs.release_type == 'monthly' || inputs.release_type == 'manual')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: kernel-$(date +%Y%m%d)-${{ github.run_number }}
          name: Kernel Build $(date +%Y-%m-%d)
          body: |
            Automated kernel build for OnePlus 8T (kebab)
            
            **Build Date:** $(date +%Y-%m-%d)
            **Architecture:** arm64
            **Defconfig:** ${DEFCONFIG}
            **Release Type:** ${{ inputs.release_type || 'scheduled' }}
            **Workflow Run:** ${{ github.run_number }}
            
            **Assets:**
            - boot.img - Flashable kernel image
            - kernel-build-*.zip - Complete build output with Image, dtb.img, dtbo.img
            
            **Note:** This is an automated build. For best results, use with a matching ramdisk from your ROM.
            
            **Instructions:**
            1. Download boot.img
            2. Flash using: `fastboot flash boot boot.img`
            3. Or include in a custom ROM
          files: |
            out/boot.img
            out/Image-dtb
            out/dtb.img
            out/dtbo.img
            out/kernel-build-*.zip
            out/*.sha256
          draft: false
          prerelease: ${{ inputs.release_type != 'monthly' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify build status
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Send notification
        run: |
          echo "Build completed with status: ${{ needs.build.result }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_number }}"
